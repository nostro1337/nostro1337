<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="898" height="218" x="1" y="1" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Grid Overlay -->
  <rect width="898" height="218" x="1" y="1" rx="12" fill="url(#grid)" opacity="0.7"/>

  <!-- Terminal Top Bar -->
  <circle cx="28" cy="26" r="5" fill="#30363d"/>
  <circle cx="44" cy="26" r="5" fill="#30363d"/>
  <circle cx="60" cy="26" r="5" fill="#30363d"/>
  <text x="80" y="30" fill="#6e7681" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500">terminal://nostro-primary-node</text>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(680, 16)">
    <rect width="190" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="14" cy="11" r="3.5" fill="#3fb950"/>
    <text x="26" y="15" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.5">STATUS: OPERATIONAL</text>
  </g>

  <!-- Main Name / Callout -->
  <text x="450" y="115" text-anchor="middle" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="4">NOSTRO</text>

  <!-- Subtitle Tagline -->
  <text x="450" y="152" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" letter-spacing="1.5">>_ System Administrator | Infrastructure &amp; Automation</text>

  <!-- Bottom Tech Specs -->
  <g transform="translate(0, 185)">
    <line x1="40" y1="0" x2="860" y2="0" stroke="#21262d" stroke-width="1"/>
    <text x="450" y="18" text-anchor="middle" fill="#484f58" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2">LINUX  ●  DEVOPS  ●  KUBERNETES  ●  ANSIBLE  ●  OBSERVABILITY</text>
  </g>
</svg>
