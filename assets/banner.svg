<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="210">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c12"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Subtle Technical Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#21262d" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="898" height="208" x="1" y="1" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Grid Overlay -->
  <rect width="898" height="208" x="1" y="1" rx="14" fill="url(#grid)" opacity="0.6"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="4.5" fill="#30363d"/>
  <circle cx="44" cy="24" r="4.5" fill="#30363d"/>
  <circle cx="60" cy="24" r="4.5" fill="#30363d"/>
  <text x="80" y="28" fill="#6e7681" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500">~ / egor-sotnikov / portfolio</text>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(685, 14)">
    <rect width="185" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="14" cy="11" r="3.5" fill="#58a6ff"/>
    <text x="26" y="15" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.5">FOCUS: GROWTH &amp; LABS</text>
  </g>

  <!-- Main Name -->
  <text x="450" y="105" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="4">EGOR SOTNIKOV</text>

  <!-- Subtitle Tagline -->
  <text x="450" y="138" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" letter-spacing="1">>_ Junior System Administrator  ●  Home Lab  ●  AI Workflows</text>

  <!-- Bottom Divider & Badges -->
  <g transform="translate(0, 172)">
    <line x1="40" y1="0" x2="860" y2="0" stroke="#21262d" stroke-width="1"/>
    <text x="450" y="20" text-anchor="middle" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2">SYSTEMS  ●  NETWORKING  ●  LEARNING LINUX  ●  AI-ASSISTED DEV</text>
  </g>
</svg>
